<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f5f5;
        }

        /* Navbar */
        nav {
            background: #222;
            padding: 18px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav h2 {
            color: white;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 25px;
            font-size: 16px;
        }

        nav a:hover {
            color: #00bcd4;
        }

        /* Home Section */
        .home {
            height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            background: linear-gradient(135deg, #00bcd4, #3f51b5);
            color: white;
        }

        .home h1 {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .home p {
            font-size: 20px;
            margin-bottom: 25px;
        }

        .btn {
            display: inline-block;
            background: white;
            color: #333;
            padding: 12px 25px;
            border-radius: 5px;
            text-decoration: none;
            margin: 5px;
        }

        .btn:hover {
            background: #222;
            color: white;
        }

        /* About Section */
        .about {
            padding: 50px;
            text-align: center;
            background: white;
        }

        .about h2 {
            margin-bottom: 15px;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <!-- Navigation Bar -->
    <nav>
        <h2>My Website</h2>

        <div>
            
            <a href="login.html">Login</a>
            <a href="register.html">Register</a>
        </div>
    </nav>

    <!-- Home Section -->
    <section class="home">
        <div>
            <h1>Welcome to My Website</h1>

            <p>
                Welcome! Please login or create an account to continue.
            </p>

            <a href="login.html" class="btn">Login</a>
            <a href="register.html" class="btn">Register</a>
        </div>
    </section>

    <!-- About Section -->
    <section class="about">
        <h2>About Us</h2>

        <p>
            This is a simple and user-friendly website.
            You can login, register and access your account.
        </p>
    </section>

    <!-- Footer -->
    <footer>
        <p>© 2026 My Website. All Rights Reserved.</p>
    </footer>

</body>
</html>
